name: Build and deploy Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install test dependencies
        run: npm ci
      - name: Validate all aligned translations
        run: node scripts/check_alignment.js --strict
      - name: Build the complete site
        run: node scripts/build_site.js
      - name: Verify illustrated overviews and optimized assets
        run: npm run check:comics
      - name: Verify mobile layout contract
        run: npm run check:mobile
      - name: Verify unified quiz player
        run: npm run check:quiz-player
      - name: Verify interactions and saved practice
        run: npm run check:interactions && npm run check:app
      - name: Verify approval and build regressions
        run: npm run check:validation && npm run check:build
      - name: Verify rendered original reveal pairs
        run: npm run check:reveals
      - name: Enforce publish gates
        run: node scripts/validate_content.js --publish-gate
      - name: Require English learning materials
        run: npm run check:english
      - name: Verify links and privacy gates
        run: node scripts/check_site_links.js --site-dir docs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
