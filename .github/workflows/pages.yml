name: Build and deploy Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate all aligned translations
        run: node scripts/check_alignment.js --strict
      - name: Build the complete site
        run: node scripts/build_site.js
      - name: Verify rendered original reveal pairs
        shell: bash
        run: |
          while IFS= read -r slug; do
            node scripts/check_rendered_reveals.js --slug "$slug" --site-dir docs
          done < <(node -e "const m=require('./manifest/readings.json'); console.log(m.readings.map(r=>r.slug).join('\\n'))")
      - name: Enforce publish gates
        run: node scripts/validate_content.js --publish-gate
      - name: Verify links and privacy gates
        run: node scripts/check_site_links.js --site-dir docs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
